<header [class.scrolled]="isScrolledPast100Dvh()">
    <div class="switch">
        <label class="switch__wrapper">
            <input
                type="checkbox"
                aria-label="Switch language"
                [checked]="i18n.lang() === 'de'"
                (change)="i18n.toggle()"
            />
            <span class="switch__slider"></span>
            <div></div>
        </label>
    </div>

    <button
        class="burger"
        type="button"
        aria-label="Toggle menu"
        [attr.aria-expanded]="menuOpen"
        [class.burger-open]="menuOpen"
        (click)="toggleMenu()"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="nav" [class.nav-open]="menuOpen">
        <a (click)="scrollToSection('scroll-about-me')">
            <p>{{ i18n.t('header.aboutMe') }}</p>
            <p class="fancyDot">•</p>
        </a>

        <a (click)="scrollToSection('scroll-technologies')">
            <p>Skills</p>
            <p class="fancyDot">•</p>
        </a>

        <a (click)="scrollToSection('scroll-featured-projects')">
            <p>{{ i18n.t('header.projects') }}</p>
            <p class="fancyDot">•</p>
        </a>
    </nav>

    <a class="logo-container" (click)="scrollToSection('scroll-about-me')">
        <img class="logo default" src="/assets/images/RE_Hollow_Transparent.png" alt="Logo" />
        <img class="logo hover" src="/assets/images/RE_Transparent.png" alt="Logo Hover" />
    </a>
</header>
