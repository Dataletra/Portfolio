<div class="wrapper" id="scroll-about-me">
    <div class="image-container">
        <img class="aboutMeImage" src="assets/images/AboutMeV2.png" />
        <img class="aboutMeImage-background" src="assets/images/Capa_1.svg" />
    </div>
    <div class="biography-container">
        <p class="bio-label">{{ i18n.t('aboutMe.label') }}</p>
        <div class="About-me-container">
            <h1>{{ i18n.t('aboutMe.title') }}</h1>
            <p class="bio">{{ i18n.t('aboutMe.bio') }}</p>
            <div class="detail-text-container">
                <img class="topic-icon-location" src="assets/images/aboutMeHighlights/location.svg" />
                <p class="topic-text" [innerHTML]="i18n.t('aboutMe.location')"></p>
            </div>
            <div class="detail-text-container">
                <img class="topic-icon" src="assets/images/aboutMeHighlights/cognition.svg" />
                <p class="topic-text">{{ i18n.t('aboutMe.curiosity') }}</p>
            </div>
            <div class="detail-text-container">
                <img class="topic-icon" src="assets/images/aboutMeHighlights/quality.svg" />
                <p class="topic-text">{{ i18n.t('aboutMe.approach') }}</p>
            </div>
        </div>
    </div>
</div>
